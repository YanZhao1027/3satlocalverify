name: Python syntax smoke
on:
  push:
    paths:
      - 'execution-prototype/**/*.py'
      - '.github/workflows/python-smoke.yml'
  pull_request:
    paths:
      - 'execution-prototype/**/*.py'
      - '.github/workflows/python-smoke.yml'
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Python source
        run: |
          find execution-prototype -type f -name '*.py' -print0 | xargs -0 -r python -m py_compile
